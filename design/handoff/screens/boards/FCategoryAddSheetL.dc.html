<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F8F8F8; color: #1D1D1D; font-family: 'IBM Plex Sans KR', sans-serif">

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; background: #FFFFFF; display: flex; gap: 10px">
<button type="button" onClick="{{closeSheet}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #F0F0F0; color: #1D1D1D; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500">취소</button>
<button type="button" onClick="{{save}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #1D1D1D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; flex-grow: 2"><sc-if value="{{isCreate}}" hint-placeholder-val="{{false}}">만들기</sc-if></button>
</div>
</div></sc-if><sc-if value="{{isDiscard}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.24); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px)"></div>

<div style="display: flex; gap: 10px; margin-top: 4px"><button type="button" onClick="{{keepEditing}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #F0F0F0; color: #1D1D1D; font-size: 16px; font-weight: 500">계속 편집</button><button type="button" onClick="{{discardAll}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #1D1D1D; color: #FFFFFF; font-size: 16px; font-weight: 700">버리기</button></div>
</div></sc-if>
</div>
