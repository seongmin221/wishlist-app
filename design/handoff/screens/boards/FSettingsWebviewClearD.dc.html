<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다크 웹뷰 데이터 삭제 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#F4F3F0;text-decoration:none}a:hover{color:#A9A7A2}
input::placeholder{color:#A9A7A2}
input.ed:focus{border-bottom-color:currentColor !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1D1D1D; color: #F4F3F0; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="position: absolute; inset: 0; overflow-y: auto">
<div style="height: 44px"></div>
<header style="position: sticky; top: 0; z-index: 1; background: #1D1D1D; padding: 12px 20px 14px; display: flex; align-items: center; gap: 12px"><a href="{{homeHref}}" aria-label="뒤로" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #312F30; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; font-size: 22px; font-weight: 700">설정</h1></header>
<div style="padding: 8px 20px 60px; display: flex; flex-direction: column; gap: 24px">
<section style="display: flex; flex-direction: column; gap: 8px"><h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 500; color: #A9A7A2">계정</h2><div style="border-radius: 28px; background: #312F30; padding: 4px 0; display: flex; flex-direction: column"><sc-if value="{{logged}}" hint-placeholder-val="{{true}}"><div style="min-height: 72px; padding: 8px 16px; display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #1D1D1D; color: #F4F3F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">user@example.com</span><span style="font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: 500; white-space: nowrap; color: #A9A7A2;">Google로 로그인됨</span></span></div><button type="button" onClick="{{openOut}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 56px; padding: 8px 14px 8px 16px; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">로그아웃</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"></path></svg></button></sc-if>
<sc-if value="{{loggedOut}}" hint-placeholder-val="{{false}}"><div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px"><span style="font-size: 15px; line-height: 1.5; word-break: keep-all">로그인하면 저장한 상품의 정보를 가져오고 다른 기기에서도 볼 수 있어요</span><a href="FLoginD.dc.html" style="height: 52px; border-radius: 26px; background: #F4F3F0; color: #1D1D1D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">로그인</a></div></sc-if></div></section><section style="display: flex; flex-direction: column; gap: 8px"><h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 500; color: #A9A7A2">원본 링크</h2><div style="border-radius: 28px; background: #312F30; padding: 4px 0; display: flex; flex-direction: column"><button type="button" onClick="{{openWv}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 56px; padding: 8px 14px 8px 16px; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">웹뷰 데이터 삭제</span><span style="font-size: 13px; color: #A9A7A2">{{wvSub}}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"></path></svg></button></div></section><section style="display: flex; flex-direction: column; gap: 8px"><h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 500; color: #A9A7A2">앱 정보</h2><div style="border-radius: 28px; background: #312F30; padding: 4px 0; display: flex; flex-direction: column"><button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 56px; padding: 8px 14px 8px 16px; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">버전</span></span><span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: #A9A7A2">1.0.0</span></button><button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 56px; padding: 8px 14px 8px 16px; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">오픈소스 라이선스</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"></path></svg></button></div></section>
</div>
</div>
<sc-if value="{{isOut}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px)"></div>
<div role="dialog" aria-label="로그아웃할까요?" style="position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); z-index: 21; box-sizing: border-box; padding: 24px 20px 20px; border-radius: 36px; background: #2A2A2A; color: #F4F3F0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">로그아웃할까요?</h2>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; word-break: keep-all; display: flex; flex-direction: column; gap: 2px"><li>이 기기의 로그인만 풀려요</li><li>저장한 상품은 계정에 남아요</li><li>다시 로그인하면 이어서 볼 수 있어요</li></ul>
<div style="display: flex; gap: 10px; margin-top: 4px"><button type="button" onClick="{{closeOut}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #3A3939; color: #F4F3F0; font-size: 16px; font-weight: 500">취소</button><button type="button" onClick="{{doOut}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #F4F3F0; color: #1D1D1D; font-size: 16px; font-weight: 700">로그아웃</button></div>
</div></sc-if>
<sc-if value="{{isWv}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px)"></div>
<div role="dialog" aria-label="웹뷰 데이터를 삭제할까요?" style="position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); z-index: 21; box-sizing: border-box; padding: 24px 20px 20px; border-radius: 36px; background: #2A2A2A; color: #F4F3F0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">웹뷰 데이터를 삭제할까요?</h2>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; word-break: keep-all; display: flex; flex-direction: column; gap: 2px"><li>쇼핑몰 로그인이 풀려요</li><li>방문 기록과 쿠키가 지워져요</li><li>저장한 상품은 그대로예요</li><li>되돌릴 수 없어요</li></ul>
<div style="display: flex; gap: 10px; margin-top: 4px"><button type="button" onClick="{{closeWv}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #3A3939; color: #F4F3F0; font-size: 16px; font-weight: 500">취소</button><button type="button" onClick="{{doWv}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #C62828; color: #FFFFFF; font-size: 16px; font-weight: 700">삭제</button></div>
</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = Object.assign({ logged: true, out: false, wv: false, wvDone: false }, { wv: true }); }
renderVals() {
const s = this.state;
return {
logged: s.logged, loggedOut: !s.logged, homeHref: s.logged ? 'FHomeD.dc.html' : 'FHomeLoggedOutD.dc.html',
isOut: s.out, openOut: () => this.setState({ out: true }), closeOut: () => this.setState({ out: false }), doOut: () => this.setState({ out: false, logged: false }),
isWv: s.wv, openWv: () => this.setState({ wv: true }), closeWv: () => this.setState({ wv: false }), doWv: () => this.setState({ wv: false, wvDone: true }),
wvSub: s.wvDone ? '방금 삭제했어요' : '쇼핑몰 로그인과 방문 기록'
};
}
}
</script>
</body>
</html>
