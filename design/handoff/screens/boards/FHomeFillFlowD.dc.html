<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다크 홈 정보 보완 연속 처리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#F4F3F0;text-decoration:none}a:hover{color:#A9A7A2}
input::placeholder{color:#A9A7A2}
input.ed:focus{border-bottom-color:currentColor !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1D1D1D; color: #F4F3F0; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column">
<header style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
<a href="FHomeD.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 22px; background: #312F30; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700">정보 보완 필요</div>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}"><div style="width: 44px; text-align: right; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 500; white-space: nowrap; color: #A9A7A2;">{{pos}}</div></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}"><div style="width: 44px"></div></sc-if>
</header>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 140px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 28px; background: #312F30">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #432420; color: #F59A86; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 15px; font-weight: 700; word-break: keep-all">{{cur.msg}}</span>
<span style="font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: 500; white-space: nowrap; color: #A9A7A2;">{{cur.domain}}</span>
</div>
<a href="#" style="min-height: 44px; padding: 0 4px; display: flex; align-items: center; gap: 4px; font-size: 14px">원본<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
</div>
<sc-if value="{{cur.failed}}" hint-placeholder-val="{{true}}">
<div style="display: flex"><button type="button" onClick="{{reanalyze}}" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: none; background: #312F30; color: #F4F3F0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>다시 분석하기</button></div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #A9A7A2"><span style="flex-grow: 1; height: 1px; background: #3A3939"></span>또는 직접 입력<span style="flex-grow: 1; height: 1px; background: #3A3939"></span></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A9A7A2">대표 이미지 · 선택</span>
<sc-if value="{{cur.noImg}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 120px; border-radius: 20px; border: 1.5px dashed #5A5958; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #A9A7A2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>사진 보관함에서 추가</button></sc-if>
<sc-if value="{{cur.hasImg}}" hint-placeholder-val="{{false}}"><div style="width: 120px; height: 120px; box-sizing: border-box; padding: 14px; border-radius: 20px; background: {{cur.ph}}; display: flex; align-items: center; justify-content: center; overflow: hidden"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 48 48" fill="none" stroke="{{cur.phS}}" stroke-width="3" stroke-linecap="round"><path d="M10 30v-6a14 14 0 0 1 28 0v6"></path><rect x="7" y="28" width="8" height="12" rx="3" fill="{{cur.phF}}"></rect><rect x="33" y="28" width="8" height="12" rx="3" fill="{{cur.phF}}"></rect></svg></div></sc-if>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A9A7A2">제품명 · 필수</span>
<sc-if value="{{cur.failed}}" hint-placeholder-val="{{true}}"><input type="text" placeholder="예: 소니 WH-1000XM6" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; border: none; background: #312F30; font: inherit; font-size: 16px; color: inherit; outline: none"></sc-if><sc-if value="{{cur.ok}}" hint-placeholder-val="{{false}}"><input type="text" defaultValue="{{cur.name}}" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; border: none; background: #312F30; font: inherit; font-size: 16px; color: inherit; outline: none"></sc-if>
</label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A9A7A2">카테고리 · 필수</span>
<button type="button" style="height: 56px; box-sizing: border-box; padding: 0 14px 0 18px; border-radius: 20px; border: none; background: #312F30; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #A9A7A2">카테고리 선택<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; background: #1D1D1D; display: flex; gap: 10px">
<button type="button" onClick="{{skip}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #312F30; color: #F4F3F0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500">건너뛰기</button>
<button type="button" onClick="{{save}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #F4F3F0; color: #1D1D1D; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; flex-grow: 2">저장하고 다음</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; padding: 0 24px 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 28px; background: #1E3A2B; color: #7DD3A5; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"></path></svg></span>
<h2 style="margin: 0; font-size: 24px; font-weight: 700">보완을 마쳤어요</h2>
<p style="margin: 0; font-size: 15px; color: #A9A7A2">{{summary}}</p>
<a href="FHomeD.dc.html" style="margin-top: 12px; height: 52px; padding: 0 28px; border-radius: 26px; background: #F4F3F0; color: #1D1D1D; display: flex; align-items: center; font-size: 16px; font-weight: 700">홈으로</a>
<button type="button" onClick="{{restart}}" style="all: unset; cursor: pointer; min-height: 44px; font-size: 14px; color: #A9A7A2">처음부터 다시 보기</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, saved: 0, skipped: 0 }; }
renderVals() {
const items = [{"failed": true, "hasImg": false, "name": "", "domain": "coupang.com", "msg": "상품 정보를 가져오지 못했어요", "ph": "#FFFFFF", "phS": "#9A9A96", "phF": "#D8D8D4"}, {"failed": false, "hasImg": true, "name": "오크 원목 사이드 테이블", "domain": "ohou.se", "msg": "카테고리를 정하지 못했어요", "ph": "#3F4B44", "phS": "#C9D3CB", "phF": "#7F8E84"}, {"failed": false, "hasImg": true, "name": "FiiO BTR7", "domain": "fiio.com", "msg": "카테고리를 지워서 비었어요", "ph": "#FFFFFF", "phS": "#9A9A96", "phF": "#D8D8D4"}];
const s = this.state;
const done = s.i >= items.length;
const cur = items[Math.min(s.i, items.length - 1)];
return {
cur: { ...cur, noImg: !cur.hasImg, ok: !cur.failed }, done: done, notDone: !done,
pos: (Math.min(s.i, items.length - 1) + 1) + ' / ' + items.length,
summary: '저장 ' + s.saved + ' · 건너뜀 ' + s.skipped,
reanalyze: () => {},
save: () => this.setState({ i: s.i + 1, saved: s.saved + 1 }),
skip: () => this.setState({ i: s.i + 1, skipped: s.skipped + 1 }),
restart: () => this.setState({ i: 0, saved: 0, skipped: 0 })
};
}
}
</script>
</body>
</html>
