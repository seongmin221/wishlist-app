<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 정보 보완 연속 처리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#1A1A1A;text-decoration:none}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1A1A1A; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column">
<header style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
<a href="Home.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 22px; background: #F0F0F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700">정보 보완 필요</div>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}"><div style="width: 44px; text-align: right; font-size: 15px; color: #6B6B6B">{{pos}}</div></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}"><div style="width: 44px"></div></sc-if>
</header>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 210px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #F0F0F0">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{cur.msg}}</span>
<span style="font-size: 13px; color: #6B6B6B">{{cur.domain}}</span>
</div>
<a href="#" style="min-height: 44px; padding: 0 6px; display: flex; align-items: center; gap: 4px; font-size: 14px">원본<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
</div>
<sc-if value="{{cur.failed}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 48px; border-radius: 24px; border: 1.5px solid #1A1A1A; background: #FFFFFF; font-size: 15px">다시 분석하기</button>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6B6B6B"><span style="flex-grow: 1; height: 1px; background: #E2E2E2"></span>또는 직접 입력<span style="flex-grow: 1; height: 1px; background: #E2E2E2"></span></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #6B6B6B">대표 이미지 · 선택</span>
<sc-if value="{{cur.noImg}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 120px; border-radius: 18px; border: 1.5px dashed #BDBDBD; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #6B6B6B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>사진 보관함에서 추가</button></sc-if>
<sc-if value="{{cur.hasImg}}" hint-placeholder-val="{{false}}"><div style="height: 120px; border-radius: 18px; background: #C9C9C9"></div></sc-if>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #6B6B6B">제품명 · 필수</span>
<sc-if value="{{cur.failed}}" hint-placeholder-val="{{true}}"><input type="text" placeholder="예: 소니 WH-1000XM6" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #1A1A1A; font: inherit; font-size: 16px"></sc-if><sc-if value="{{cur.ok}}" hint-placeholder-val="{{false}}"><input type="text" defaultValue="{{cur.name}}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #1A1A1A; font: inherit; font-size: 16px"></sc-if>
</label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #6B6B6B">카테고리 · 필수</span>
<button type="button" style="height: 52px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 14px; border: 1.5px solid #1A1A1A; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #6B6B6B">카테고리 선택<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; background: #FFFFFF; border-top: 1px solid #E2E2E2; display: flex; gap: 10px">
<button type="button" onClick="{{skip}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: 1.5px solid #1A1A1A; background: #FFFFFF; font-size: 16px">건너뛰기</button>
<button type="button" onClick="{{save}}" style="flex: 2 1 0; height: 56px; border-radius: 28px; border: none; background: #1A1A1A; color: #FFFFFF; font-size: 16px">저장하고 다음</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; padding: 0 24px 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 20px; background: #F0F0F0; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"></path></svg></span>
<h2 style="margin: 0; font-size: 24px; font-weight: 700">보완을 마쳤어요</h2>
<p style="margin: 0; font-size: 15px; color: #6B6B6B">{{summary}}</p>
<a href="Home.dc.html" style="margin-top: 12px; height: 52px; padding: 0 28px; border-radius: 26px; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; font-size: 16px">홈으로</a>
<button type="button" onClick="{{restart}}" style="all: unset; cursor: pointer; min-height: 44px; font-size: 14px; color: #6B6B6B">처음부터 다시 보기</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, saved: 0, skipped: 0 }; }
renderVals() {
const items = [{"failed": true, "hasImg": false, "name": "", "domain": "coupang.com", "msg": "상품 정보를 가져오지 못했어요"}, {"failed": false, "hasImg": true, "name": "오크 원목 사이드 테이블", "domain": "ohou.se", "msg": "카테고리를 정하지 못했어요"}, {"failed": false, "hasImg": true, "name": "FiiO BTR7", "domain": "fiio.com", "msg": "카테고리를 지워서 비었어요"}];
const s = this.state;
const done = s.i >= items.length;
const cur = items[Math.min(s.i, items.length - 1)];
return {
cur: { ...cur, noImg: !cur.hasImg, ok: !cur.failed }, done: done, notDone: !done,
pos: (Math.min(s.i, items.length - 1) + 1) + ' / ' + items.length,
summary: '저장 ' + s.saved + ' · 건너뜀 ' + s.skipped,
save: () => this.setState({ i: s.i + 1, saved: s.saved + 1 }),
skip: () => this.setState({ i: s.i + 1, skipped: s.skipped + 1 }),
restart: () => this.setState({ i: 0, saved: 0, skipped: 0 })
};
}
}
</script>
</body>
</html>
